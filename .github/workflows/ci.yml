name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        run: pytest --cov=utilities_clustering --cov-report=term-missing

      # Regenerates every artefact from scratch, then asserts the numbers the README
      # publishes still hold. If a dependency bump invalidates the write-up, this fails
      # instead of letting the README quietly become false.
      - name: Reproduce the pipeline and verify the published metrics
        shell: bash
        run: |
          python scripts/run_analysis.py --output ci-outputs
          python scripts/verify_published_metrics.py ci-outputs/metrics.json

      - name: Upload generated artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ci-outputs/
          retention-days: 7